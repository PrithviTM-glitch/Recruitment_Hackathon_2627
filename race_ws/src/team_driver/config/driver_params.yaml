# Save this file and the running driver reloads it within 1 s (no restart).
# Comments say which way to push each number.

driver:
  ros__parameters:
    # LiDAR gap finding
    fov_deg: 90.0            # [deg] half-angle of scan used. Smaller ignores side walls.
    smooth_beams: 5          # beams averaged. Higher is calmer but blurs gaps.
    disparity_thresh: 0.5    # [m] range jump counted as an edge. Lower sees more edges.
    car_half_width: 0.24     # [m] margin at edges. Higher = wider berth, tighter gaps close up.
    bubble_radius: 0.45      # [m] blanked round the closest return. Higher = wider turns.
    gap_min_range: 1.5       # [m] beams beyond this count as free.
    edge_margin_beams: 30    # beams kept off a gap's edge (4 beams = 1 deg). Higher = aim more central.
    lookahead: 1.5           # [m] centreline aim point. Lower hugs the line, higher cuts corners.

    # Steering
    steer_gain: 1.0          # gap angle to steering. Higher turns in harder and earlier.
    max_steer: 1.0           # [0-1] cap on steering. Lower it if the car spins.
    steer_smooth: 0.0        # [0-0.9] low-pass on steering. Higher is smoother but laggy.

    # Target speed
    v_max: 8.0               # [m/s] top speed on a straight.
    v_min: 1.0               # [m/s] floor in corners. Higher = brakes less.
    front_cone_deg: 8.0      # [deg] cone ahead used for wall distance.
    brake_dist: 6.0          # [m] starts slowing for a wall this far ahead. Lower = brakes later.
    steer_slow: 0.6          # [0-1] how much steering cuts speed. Lower = slows less in turns.

    # Speed controller (target speed to throttle)
    ff_gain: 0.10            # throttle per m/s, feed-forward.
    kp: 0.15                 # proportional on speed error.
    ki: 0.05                 # integral on speed error.
    i_max: 1.0               # clamp on the integral.
